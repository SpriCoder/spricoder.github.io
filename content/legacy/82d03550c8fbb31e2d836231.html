<h2 id="c-stack"><a class="markdownIt-Anchor" href="#c-stack"></a> c++ stack</h2>
<ol>
<li>简要记录比较通俗易懂的stack(c++内置版本)</li>
<li>头文件:<code>#include&lt;stack&gt;</code></li>
<li>是一个FIFO的线性链表</li>
</ol>
<table>
<thead>
<tr>
<th>函数名</th>
<th>功能</th>
<th>其他备注</th>
</tr>
</thead>
<tbody>
<tr>
<td>top()</td>
<td>取出栈顶元素</td>
<td>不删除栈顶元素</td>
</tr>
<tr>
<td>pop()</td>
<td>删除栈顶元素</td>
<td>无</td>
</tr>
<tr>
<td>empty()</td>
<td>检验栈是否为空</td>
<td>为空则为true</td>
</tr>
<tr>
<td>push()</td>
<td>在栈顶增加元素</td>
<td>无</td>
</tr>
<tr>
<td>size()</td>
<td>返回栈中元素个数</td>
<td>无</td>
</tr>
</tbody>
</table>
