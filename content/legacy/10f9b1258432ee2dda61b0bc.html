pan class="hljs-type">String</span> <span class="hljs-title function_">upload</span><span class="hljs-params">(OSSConfig ossConfig, MultipartFile file, String fileDir)</span><br>    &#123;<br>        initOSS(ossConfig);<br>        <span class="hljs-type">StringBuilder</span> <span class="hljs-variable">fileUrl</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">StringBuilder</span>();<br>        <span class="hljs-keyword">try</span> &#123;<br>            <span class="hljs-type">String</span> <span class="hljs-variable">suffix</span> <span class="hljs-operator">=</span> file.getOriginalFilename().substring(file.getOriginalFilename().lastIndexOf(<span class="hljs-string">&#x27;.&#x27;</span>));<br>            <span class="hljs-type">String</span> <span class="hljs-variable">fileName</span> <span class="hljs-operator">=</span> System.currentTimeMillis() + <span class="hljs-string">&quot;-&quot;</span> + UUID.randomUUID().toString().substring(<span class="hljs-number">0</span>,<span class="hljs-number">18</span>) + suffix;<span class="hljs-comment">//时间 + UUID生成随机的</span><br>            <span class="hljs-keyword">if</span> (!fileDir.endsWith(<span class="hljs-string">&quot;/&quot;</span>)) &#123;<br>                fileDir = fileDir.concat(<span class="hljs-string">&quot;/&quot;</span>);<span class="hljs-comment">//如果没有则最后加上一个/</span><br>            &#125;<br>            fileUrl = fileUrl.append(fileDir + fileName);<br><br>            ossClient.putObject(ossConfig.getBucketName(), fileUrl.toString(), file.getInputStream());<br>        &#125; <span class="hljs-keyword">catch</span> (IOException e) &#123;<br>            e.printStackTrace();<br>            <span class="hljs-keyword">return</span> <span class="hljs-literal">null</span>;<br>        &#125;<br>        fileUrl = fileUrl.insert(<span class="hljs-number">0</span>,ossConfig.getUrl());<br>        <span class="hljs-keyword">return</span> fileUrl.toString( <figure class="highlight java"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br></pre></td><td class="code"><pre><code class="hljs java"><span class="hljs-meta">@RestController</span><br><span class="hljs-meta">@RequestMapping(&quot;/oss&quot;)</span><br><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UploadController</span> &#123;<br><br>    <span class="hljs-meta">@Autowired</span><br>    UploadService uploadService;<br><br>    <span class="hljs-comment">/**</span><br><span class="hljs-comment">     * 上传文件</span><br><span class="hljs-comment">     * <span class="hljs-doctag">@param</span> multipartFile</span><br><span class="hljs-comment">     * <span class="hljs-doctag">@return</span></span><br><span class="hljs-comment">     */</span><br>    <span class="hljs-meta">@PostMapping(&quot;/upload&quot;)</span><br>    <span class="hljs-keyword">public</span> <span class="hljs-type">SimpleResponse</span> <span class="hljs-title function_">upload</span><span class="hljs-params">(<span class="hljs-meta">@RequestBody</span> MultipartFile multipartFile)</span>&#123;<br>        <span c <figure class="highlight java"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br><span class="line">31</span><br><span class="line">32</span><br><span class="line">33</span><br><span class="line">34</span><br><span class="line">35</span><br><span class="line">36</span><br><span class="line">37</span><br></pre></td><td class="code"><pre><code class="hljs java"><span class="hljs-meta">@Service</span><br><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UploadService</span> &#123;<br>    <span class="hljs-meta">@Autowired</span><br>    OSSClientUtil ossClientUtil;<br><br>    <span class="hljs-keyword">public</span> <span class="hljs-type">SimpleResponse</span> <span class="hljs-title function_">upload</span><span class="hljs-params">(MultipartFile multipartFile)</span>&#123;<br>        <span class="hljs-keyword">if</span>(multipartFile == <span class="hljs-literal">null</span>)&#123;<br>            <span class="hljs-keyword">return</span> SimpleResponse.error(<span class="hljs-string">&quo
