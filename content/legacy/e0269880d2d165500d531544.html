s="hljs-string">&quot;userId&quot;</span>] == user_id][<span class="hljs-string">&quot;movieId&quot;</span>]<br><br>        <span class="hljs-comment"># 影片相似度</span><br>        similarity_movies = []<br>        weight_similarity = <span class="hljs-number">0.0</span><br>        total_similarity = <span class="hljs-number">0.0</span><br><br>        <span class="hljs-keyword">for</span> seen_movie_id <span class="hljs-keyword">in</span> seen_movie_ids:<br>            seen_movie_ratings = <span class="hljs-variable language_">self</span>.rating_data[<span class="hljs-variable language_">self</span>.rating_data[<span class="hljs-string">&quot;movieId&quot;</span>] == seen_movie_id]<br><br>            <span class="hljs-keyword">try</span>:<br>                similarity = <span class="hljs-variable language_">self</span>.all_movie_similarity[<span class="hljs-variable language_">self</span>.movie_origin_source[seen_movie_id]][<br>                    <span class="hljs-variable language_">self</span>.movie_origin_source[movie_id]]<br>            <span class="hljs-keyword">except</span> Exception <span class="hljs-keyword">as</span> e:<br>                similarity = <span class="hljs-number">0.0</span><br>            similarity_movie = [seen_movie_id, similarity]<br>            similarity_movies.append(similarity_movie)<br><br>            weight_similarity += similarity * \<br>                                 seen_movie_ratings[seen_movie_ratings[<span class="hljs-string">&quot;userId&quot;</span>] == user_id][<span class="hljs-string">&quot;rating&quot;</span>].values[<span class="hljs-number">0</span>]<br>            total_similarity += similarity<br>        result = weight_similarity / total_similarity<br>        <span class="hljs-keyword">if</span>(movie_id <span class="hljs-keyword">not</span> <span class="hljs-keyword">in</span> <span class="hljs-variable language_">self</span>.movie_average):<br>            <span class="hljs-keyword">return</span> result<br>        <span class="hljs-keyword">return</span> result + <span class="hljs-variable language_">self</span>.movie_average[movie_id]<br><br>    <span class="hljs-keyword">def</span> <span class="hljs-title function_">content_based_predict</span>(<span class="hljs-params">self, movie_ids, seen_movie_ids, n=<span class="hljs-number">10</span></span>):<br>        <span class="hljs-string">&quot;&quot;&quot;</span><br><span class="hljs-string">        找到和 movie_id 相似的电影</span><br><span class="hljs-string">        :param movie_ids:</span><br><span class="hljs-string">        :param seen_movie_ids: 已经看过的电影</span><br><span class="hljs-string">        :param n: 推荐个数</span><br><span class="hljs-string">        :return:</span><br><span class="hljs-string">        &quot;&quot;&quot;</span><br>        tfidf = TfidfVectorizer(stop_words=<span class="hljs-string">&quot;english&quot;</span>)<br>        tfidf_matrix = tfidf.fit_transform(<span class="hljs-variable language_">self</span>.movie_data[<span class="hljs-string">&quot;genres&quot;</span>])<br>        <span class="hljs-comment"># 计算余弦相似度</span><br>        cosine_sim = linear_kernel(tfidf_matrix, tfidf_matrix)<br><br>        <span class="hljs-comment"># 建立电影列表索引，方便进行相互索引</span><br>        indices = pd.Series(<span class="hljs-variable language_">self</span>.movie_data.index, index=<span class="hljs-variable language_">self</span>.movie_data[<span class="hljs-string">&quot;movieId&quot;</span>]).drop_duplicates()<br><br>        similarities = &#123;&#125;<br>        <span class="hljs-keyword">for</span> movie_id <span class="hljs-keyword">in</span> movie_ids:<br>            idx = indices[movie_id]<br>            similarity = <span class="hljs-built_in">list</span>(<span class="hljs-built_in">enumerate</span>(cosine_sim[idx]))<br>            similarity = <span class="hljs-built_in">sorted</span>(similarity, key=<span class="hljs-keyword">lambda</span> x: x[<span class="hljs-number">1</span>], reverse=<span class="hljs-literal">True</span>)<br>            similarity = similarity[<span class="hljs-number">1</span>: <span class="hljs-number">1</span> + <span class="hljs-built_in">int</span>(n / <span class="hljs-number">2</span>)]<br>            <span class="hljs-keyword">for</span> s <span class="hljs-keyword">in</span> similarity:<br>                <span class="hljs-keyword">if</span> s[<span class="hljs-number">0</span>] <span class="hljs-keyword">in</span> similarities <span class="hljs-keyword">or</span> s[<span class="hljs-number">0</span>] <span class="hljs-keyword">in</span> seen_movie_ids:<br>                    <span class="hljs-keyword">continue</span><br>                <span class="hljs-keyword">else</span>:<br>                    similarities[s[<span class="hljs-number">0</span>]] = s[<span class="hljs-number">1</span>]<br>        recommend_ids = <span class="hljs-built_in">list</span>(similarities.keys())<br>        recommend_ids.sort(key=<span class="hljs-keyword">lambda</span> x: similarities[x], reverse=<span class="hljs-literal">True</span>)<br>        movie_indices = recommend_ids[:n]<br>        recommends = <span class="hljs-variable language_">self</span>.movie_data[<span class="hljs-string">&quot;movieId&quot;</span>].iloc[movie_indices]<br>        <span class="hljs-keyword">return</span> recommends<br><br>    <span class="hljs-keyword">def</span> <span class="hljs-title function_">predict</span>(<span class="hljs-params">self, user_ids, n=<span class="hljs-number">10</span>, least_rating=<span class="hljs-number">3.0</span></span>):<br>        <span class="hljs-string">&quot;&quot;&quot;</span><br><span class="hljs-string">        联合推荐，先通过内容推荐来缩小范围，然后使用协同过滤</span><br><span class="hljs-string">        :param user_ids: 用户范围</span><br><span class="hljs-string">        :param n:内容过滤输出为前10</span><br><span class="hljs-string">        :param least_rating:最低可以接受的评分</span><br><span class="hljs-string">        :return:</span><br><span class="hljs-string">        &quot;&quot;&quot;</span><br>        users_result = &#123;&#125;<br>        <span class="hljs-keyword">for</span> user_id <span class="hljs-keyword">in</span> tqdm(user_ids):<br>            <span class="hljs-comment"># 推荐的电影</span><br>            result = []<br>            seen_movie_ids = <span class="hljs-variable language_">self</span>.rating_data[<span class="hljs-variable language_">self</span>.rating_data[<span class="hljs-string">&quot;userId&quot;</span>] == user_id][<span class="hljs-string">&quot;movieId&quot;</span>].drop_duplicates()<br>            <span class="hljs-comment"># 选择用户最喜欢的前n个电影</span><br>            love_movie_ids = <span class="hljs-variable language_">self</span>.rating_data[<span class="hljs-variable language_">self</span>.rating_data[<span class="hljs-string">&quot;userId&quot;</span>] == user_id].sort_values(by=[<span class="hljs-string">&quot;rating&quot;</span>]).head(n)[<br>                <span class="hljs-string">&quot;movieId&quot;</span>].drop_duplicates()<br>            recommend_ids = <span class="hljs-variable language_">self</span>.content_based_predict(love_movie_ids, seen_movie_ids, n)<br>            <span class="hljs-keyword">for</span> recommend_id <span class="hljs-keyword">in</span> recommend_ids:<br>                result.append(recommend_id)<br>            <span class="hljs-comment"># 进行协同过滤(物品和用户两种)，低于预测评分不进行推荐</span><br>            recommend_scores = []<br>            <span class="hljs-keyword">for</span> recommend_id <span class="hljs-keyword">in</span> recommend_ids:<br>                user_based_score = <span class="hljs-variable language_">self</span>.user_based_one(user_id, recommend_id)<br>                movie_based_score = <span class="hljs-variable language_">self</span>.movie_based_one(user_id, recommend_id)<br>                <span class="hljs-keyword">if</span> user_based_score &lt; least_rating <span class="hljs-keyword">and</span> movie_based_score &lt; least_rating:<br>                    <span class="hljs-keyword">continue</span><br>                recommend_scores.append([recommend_id, user_based_score, movie_based_score])<br>            recommend_scores.sort(key=<span class="hljs-keyword">lambda</span> x: x[<span class="hljs-number">1</span>] + x[<span class="hljs-number">2</span>])<br>            <span class="hljs-comment"># 推荐至少前2名</span><br>            <span class="hljs-keyword">if</span> (<span class="hljs-built_in">len</span>(recommend_scores) &lt; <span class="hljs-number">2</span>):<br>                users_result[user_id] = [recommend_id[<span class="hljs-number">0</span>] <span class="hljs-keyword">for</span> recommend_id <span class="hljs-keyword">in</span> recommend_scores]<br>            <span class="hljs-keyword">else</span>:<br>                users_result[user_id] = [recommend_id[<span class="hljs-number">0</span>] <span class="hljs-keyword">for</span> recommend_id <span class="hljs-keyword">in</span> recommend_scores[:<span class="hljs-number">2</span>]]<br><br>        <span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;result/movie&quot;</span> + <span class="hljs-built_in">str</span>(time.time()) + <span class="hljs-string">&quot;.csv&quot;</span>, <span class="hljs-string">&quot;w&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>, newline=<span class="hljs-string">&quot;&quot;</span>) <span class="hljs-keyword">as</span> f:<br>            writer = csv.writer(f)<br>            writer.writerow([<span class="hljs-string">&quot;userId&quot;</span>, <span class="hljs-string">&quot;movieId&quot;</span>])<br>            <span class="hljs-keyword">for</span> user_id <span class="hljs-keyword">in</span> users_result.keys():<br>                <span class="hljs-keyword">for</span> recommend_id <span class="hljs-keyword">in</span> users_result[user_id]:<br>                    writer.writerow([user_id, recommend_id])<br><br>    <span class="hljs-keyword">def</span> <span class="hljs-title function_">evaluate</span>(<span class="hljs-params">self, user_ids, edges</span>):<br>        <span class="hljs-string">&quot;&quot;&quot;</span><br><span class="hljs-string">        评估效果，以一个用户为例，检验协同过滤算法</span><br><span class="hljs-string">        :param user_ids:</span><br><span class="hljs-string">        :param edges: 边界</span><br><span class="hljs-string">        :return:</span><br><span class="hljs-string">        &quot;&quot;&quot;</span><br>        valid = &#123;&#125;<br>        <span class="hljs-keyword">for</span> edge <span class="hljs-keyword">in</span> edges:<br>            valid[edge] = <span class="hljs-number">0</span><br>        total = <span class="hljs-number">0</span><br>        <span class="hljs-keyword">for</span> user_id <span class="hljs-keyword">in</span> user_ids:<br>            seen_movies = <span class="hljs-variable language_">self</span>.rating_data[<span class="hljs-variable language_">self</span>.rating_data[<span class="hljs-string">&quot;userId&quot;</span>] == user_id]<br>            seen_movie_ids = seen_movies[<span class="hljs-string">&quot;movieId&quot;</span>]<br>            total += <span class="hljs-built_in">len</span>(seen_movie_ids)<br>            <span class="hljs-keyword">for</span> seen_movie_id <span class="hljs-keyword">in</span> tqdm(seen_movie_ids):<br>                real_score = seen_movies[seen_movies[<span class="hljs-string">&quot;movieId&quot;</span>] == seen_movie_id][<span class="hljs-string">&quot;rating&quot;</span>].values[<span class="hljs-number">0</span>]<br>                user_based_score = <span class="hljs-variable language_">self</span>.user_based_one(user_id, seen_movie_id, <span class="hljs-literal">False</span>)<br>                movie_based_score = <span class="hljs-variable language_">self</span>.movie_based_one(user_id, seen_movie_id, <span class="hljs-literal">False</span>)<br>                <span class="hljs-keyword">for</span> edge <span class="hljs-keyword">in</span> edges:<br>                    <span class="hljs-keyword">if</span> (<span class="hljs-built_in">abs</span>(real_score - user_based_score) &lt;= edge <span class="hljs-keyword">or</span><br>                            <span class="hljs-built_in">abs</span>(real_score - movie_based_score) &lt;= edge):<br>                        valid[edge] += <span class="hljs-number">1</span><br>        <span class="hljs-keyword">for</span> edge <span class="hljs-keyword">in</span> edges:<br>            <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;上下浮动范围为&quot;</span> + <span class="hljs-built_in">str</span>(edge) + <span class="hljs-string">&quot;时的准确率为&quot;</span> + <span class="hljs-built_in">str</span>(valid[edge] / total * <span class="hljs-number">100</span>) + <span class="hljs-string">&quot;%&quot;</span>)<br><br><br><span class="hljs-keyword">if</span> __name__ == <span class="hljs-string">&#x27;__main__&#x27;</span>:<br>    myRecommend = MyRecommend(<span class="hljs-string">&quot;./ml-latest-small/movies.csv&quot;</span>,<br>                              <span class="hljs-string">&quot;./ml-latest-small/ratings.csv&quot;</span>,<br>                              <span class="hljs-string">&quot;./ml-latest-small/tags.csv&quot;</span>)<br>    myRecommend.init_similarity()<br>    <span class="hljs-built_in">print</span>(myRecommend.user_based_one(<span class="hljs-number">1</span>, <span class="hljs-number">1</span>, <span class="hljs-literal">False</span>))<br>    myRecommend.predict(<span class="hljs-built_in">range</span>(<span class="hljs-number">611</span>))<br>    myRecommend.evaluate(<span class="hljs-built_in">range</span>(<span class="hljs-number">5</span>), [<span class="hljs-number">0.25</span>, <span class="hljs-number">0.5</span>, <span class="hljs-number">0.75</span>, <span class="hljs-number">1</span>])<br></code></pre></td></tr></table></figure>
